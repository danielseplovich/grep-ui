<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  .row { display:flex; align-items:center; gap: var(--space-16); margin-bottom: var(--space-20); }
  .lab { width: var(--space-96); flex-shrink:0; font-size: var(--text-xs); color: var(--foreground-text-dim); }
</style>
</head>

const cap = (type, content, lg) =>
  `<span class="grep-kbd grep-kbd--${type}${lg?" grep-kbd--lg":""}">${content}</span>`;
const row = lg => {
  const I = lg ? K20 : K16;
  return `<div class="row">
    <span class="lab">${lg?"LG (settings)":"Default"}</span>
    ${cap("icon", I, lg)}
    ${cap("letter", "<span>K</span>", lg)}
    ${cap("number", "1", lg)}
    ${cap("label", "shift", lg)}
    ${cap("label", "return", lg)}
    <span class="grep-kbd-group">${cap("icon", I, lg)}${cap("letter","<span>K</span>",lg)}</span>
    <span class="grep-kbd-group">${cap("icon", I, lg)}${cap("label","shift",lg)}${cap("letter","<span>P</span>",lg)}</span>
  </div>`;
};
const content = () => row(false) + row(true) +
  `<div class="row"><span class="lab">In a row</span>
     <span style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--foreground-text-base)">
       Open command palette <span class="grep-kbd-group">${K16.replace('grep-kbd__icon','grep-kbd__icon')}</span></span></div>`;
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();

<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
