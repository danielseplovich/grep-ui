<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  .grep-item-block { max-width: 788px; }
  .grep-item-block__title { margin:0; }
</style>
</head>
<body>


  <div class="modes">
    <div class="mode"><h2>Light</h2><div id="l"></div></div>
    <div class="mode" data-theme="dark"><h2>Dark</h2><div id="d"></div></div>
  </div>
<script>
const TILE=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><g><path d="M14.2956 3.80238C14.2956 5.07019 13.2678 6.09795 12 6.09795C10.7322 6.09795 9.70443 5.07019 9.70443 3.80238C9.70443 2.53457 10.7322 1.50681 12 1.50681C13.2678 1.50681 14.2956 2.53457 14.2956 3.80238Z" fill="currentColor" fill-opacity="0.56"/><path d="M3.79776 7.07795C4.00533 6.87039 4.28684 6.75378 4.58038 6.75378H19.4196C19.7132 6.75378 19.9947 6.86916 20.2022 7.07672C20.4098 7.28429 20.5264 7.56581 20.5264 7.85935C20.5264 8.15289 20.4098 8.4344 20.2022 8.64197C19.9947 8.84953 19.7132 8.96614 19.4196 8.96614H15.2355C14.9744 8.96614 14.6321 9.09404 14.4452 9.58102C14.2259 10.1479 14.3333 11.2429 14.4686 12.091L14.6461 13.0932L14.6498 13.0999L14.6506 13.1076L16.0693 21.1753C16.0978 21.3207 16.0971 21.4704 16.0672 21.6155C16.0373 21.7606 15.9788 21.8984 15.8951 22.0207C15.8115 22.143 15.7043 22.2474 15.5799 22.3279C15.4554 22.4083 15.3162 22.4632 15.1703 22.4893C15.0245 22.5154 14.8749 22.5123 14.7302 22.48C14.5856 22.4477 14.4489 22.3869 14.328 22.3013C14.207 22.2156 14.1044 22.1067 14.026 21.981C13.9476 21.8552 13.895 21.7151 13.8713 21.5688L12.8912 15.9562C12.8912 15.9562 12.5833 14.6243 12 14.6243C11.4261 14.6243 11.1117 15.9562 11.1117 15.9562L10.1316 21.5639C10.1079 21.7089 10.0557 21.8478 9.97794 21.9724C9.90018 22.0971 9.79843 22.205 9.67861 22.29C9.55878 22.3751 9.42326 22.4354 9.27992 22.4676C9.13657 22.4998 8.98826 22.5032 8.84359 22.4776C8.55097 22.4249 8.29115 22.2584 8.12099 22.0145C7.95083 21.7707 7.88417 21.4694 7.93561 21.1765L9.35394 13.1088L9.35807 13.1022L9.35886 13.0945L9.53595 12.0922C9.67123 11.2441 9.77863 10.1492 9.55932 9.58225C9.37157 9.09404 9.03994 8.96737 8.75669 8.96737H4.58038C4.28684 8.96737 4.00533 8.85076 3.79776 8.6432C3.5902 8.43563 3.47359 8.15411 3.47359 7.86058C3.47359 7.56704 3.5902 7.28552 3.79776 7.07795Z" fill="currentColor" fill-opacity="0.56"/></g></g></svg>`;
const CHEV=`<svg class="grep-item-row__chevron" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M4.14733 9.35267C3.95256 9.1579 3.95256 8.8421 4.14733 8.64733L6.79466 6L4.14733 3.35267C3.95256 3.15789 3.95256 2.8421 4.14733 2.64733C4.3421 2.45256 4.6579 2.45256 4.85267 2.64733L7.85267 5.64733C8.04744 5.8421 8.04744 6.1579 7.85267 6.35267L4.85267 9.35267C4.6579 9.54744 4.3421 9.54744 4.14733 9.35267Z" fill="currentColor" fill-opacity="0.44"/></g></svg>`;
const PLUS=`<svg class="grep-icon-btn__icon" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M1.09375 7C1.09375 7.1958 1.17153 7.38359 1.30999 7.52204C1.44844 7.6605 1.63623 7.73828 1.83203 7.73828H6.13867C6.17131 7.73828 6.2026 7.75124 6.22568 7.77432C6.24875 7.7974 6.26172 7.82869 6.26172 7.86133V12.168C6.26172 12.3638 6.3395 12.5516 6.47796 12.69C6.61641 12.8285 6.8042 12.9062 7 12.9062C7.1958 12.9062 7.38359 12.8285 7.52204 12.69C7.6605 12.5516 7.73828 12.3638 7.73828 12.168V7.86133C7.73828 7.82869 7.75124 7.7974 7.77432 7.77432C7.7974 7.75124 7.82869 7.73828 7.86133 7.73828H12.168C12.3638 7.73828 12.5516 7.6605 12.69 7.52204C12.8285 7.38359 12.9062 7.1958 12.9062 7C12.9062 6.8042 12.8285 6.61641 12.69 6.47796C12.5516 6.3395 12.3638 6.26172 12.168 6.26172H7.86133C7.82869 6.26172 7.7974 6.24875 7.77432 6.22568C7.75124 6.2026 7.73828 6.17131 7.73828 6.13867V1.83203C7.73828 1.63623 7.6605 1.44844 7.52204 1.30999C7.38359 1.17153 7.1958 1.09375 7 1.09375C6.8042 1.09375 6.61641 1.17153 6.47796 1.30999C6.3395 1.44844 6.26172 1.63623 6.26172 1.83203V6.13867C6.26172 6.17131 6.24875 6.2026 6.22568 6.22568C6.2026 6.24875 6.17131 6.26172 6.13867 6.26172H1.83203C1.63623 6.26172 1.44844 6.3395 1.30999 6.47796C1.17153 6.61641 1.09375 6.8042 1.09375 7Z" fill="currentColor"/></g></svg>`;

const left = (label,sub,tile=true) => `<div class="grep-item-row__left">
  ${tile?`<span class="grep-item-row__tile">${TILE}</span>`:""}
  <div class="grep-item-row__label-frame"><div class="grep-item-row__label">
    <span class="grep-item-row__label-row">${label}</span>
    <p class="grep-item-row__sublabel">${sub}</p></div></div></div>`;

const row = ({label,sub="This is some sublabel.",slots="",rule=true,mods="",tile=true}) =>
  `<div class="grep-item-row ${mods}"><div class="grep-item-row__internal">
     ${left(label,sub,tile)}${slots}</div>${rule?`<hr class="grep-item-row__rule">`:""}</div>`;

const SLOTS = {
  chevron: `${CHEV}`,
  toggle:  `<span style="width:28px;height:16px;border-radius:999px;background:var(--foreground-brand);position:relative;flex-shrink:0"><span style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:999px;background:#fff"></span></span>`,
  input:   `<span class="grep-input" style="width:300px;flex-shrink:0"><span class="grep-input__field"><input class="grep-input__control" placeholder="Enter..."></span></span>`,
  select:  `<span class="grep-input" style="width:300px;flex-shrink:0"><span class="grep-input__field"><input class="grep-input__control" placeholder="Select..."><span class="grep-input__addon" style="padding-right:8px">${CHEV.replace('grep-item-row__chevron','').replace('<svg','<svg style="width:14px;height:14px;transform:rotate(90deg);color:var(--foreground-icon-subtle)"')}</span></span></span>`,
  button:  `<button class="grep-btn grep-btn--neutral"><span class="grep-btn__label">Label</span></button>`,
  iconBtn: `<button class="grep-icon-btn grep-icon-btn--neutral grep-icon-btn--28">${PLUS}</button>`,
  shortcut:`<span style="display:flex;gap:4px;flex-shrink:0">${["⌘","K"].map(k=>`<span style="width:16px;height:16px;border-radius:4px;background:var(--background-contrast-strong);display:flex;align-items:center;justify-content:center;font-family:var(--text-style-code),monospace;font-size:11px;color:var(--foreground-icon-subtle)">${k}</span>`).join("")}</span>`,
  badge:   `<span class="grep-badge grep-badge--success grep-badge--full"><span class="grep-badge__label">Active</span></span>`,
};

function content(){
  return `<section class="grep-item-block">
    <h3 class="grep-item-block__title">Workspace settings</h3>
    <div class="grep-item-block__group">
      ${row({label:"Chevron", slots: SLOTS.chevron, mods:"grep-item-row--interactive"})}
      ${row({label:"Hover", slots: SLOTS.chevron, mods:'grep-item-row--interactive" data-state="hover'})}
      ${row({label:"Open", slots: SLOTS.chevron, mods:"grep-item-row--open grep-item-row--interactive"})}
      ${row({label:"Toggle", slots: SLOTS.toggle})}
      ${row({label:"Input", slots: SLOTS.input})}
      ${row({label:"Select", slots: SLOTS.select})}
      ${row({label:"Two buttons", slots: SLOTS.button + SLOTS.button})}
      ${row({label:"Icon button", slots: SLOTS.badge + SLOTS.iconBtn})}
      ${row({label:"Shortcut", slots: SLOTS.shortcut + SLOTS.chevron})}
      ${row({label:"No tile", tile:false, slots: SLOTS.chevron, rule:false})}
    </div></section>`;
}
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
</body>
</html>
