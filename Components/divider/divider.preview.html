<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; gap: var(--space-24); align-items:flex-start; }
  .mode { flex:1; padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  h3 { font-size: var(--text-xs); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin: var(--space-24) 0 var(--space-12); }
  .row { display:flex; align-items:center; gap: var(--space-16); margin-bottom: var(--space-16); }
  .lab { font-size: var(--text-xs); color: var(--foreground-text-dim); white-space:nowrap; }
  .row .lab { width: var(--space-96); flex-shrink:0; }
  .vrow { display:flex; gap: var(--space-32); height: var(--space-80); }
  .vcell { display:flex; align-items:center; gap: var(--space-12); }
</style>
</head>
<body>


  <div class="modes">
    <div class="mode"><h2>Light</h2><div id="l"></div></div>
    <div class="mode" data-theme="dark"><h2>Dark</h2><div id="d"></div></div>
  </div>
<script>
const V = [["","Base / 1px"],["grep-divider--thin","Base / 0.5px"],
           ["grep-divider--subtle","Subtle / 1px"],["grep-divider--subtle grep-divider--thin","Subtle / 0.5px"]];
function content() {
  let h = `<h3>Horizontal</h3>`;
  for (const [c,l] of V) h += `<div class="row"><span class="lab">${l}</span><hr class="grep-divider ${c}"></div>`;
  h += `<h3>Vertical</h3><div class="vrow">`;
  for (const [c,l] of V) h += `<div class="vcell"><div class="grep-divider grep-divider--vertical ${c}" role="separator" aria-orientation="vertical"></div><span class="lab">${l}</span></div>`;
  h += `</div>`;
  return h;
}
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
</body>
</html>
