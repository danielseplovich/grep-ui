      </div>
    </div>
    <button class="grep-icon-btn grep-icon-btn--16 grep-icon-btn--ghost grep-toast__close" aria-label="Dismiss">${CLOSE}</button>
  </div>
  ${style==="links"?`<div class="grep-toast__actions grep-toast__actions--links">
    <button class="grep-toast__link">Save</button><button class="grep-toast__link">Undo</button></div>`:""}
  ${style==="buttons"?`<div class="grep-toast__actions">
    <button class="grep-btn grep-btn--neutral"><span class="grep-btn__label">Label</span></button>
    <button class="grep-btn grep-btn--brand"><span class="grep-btn__label">Label</span></button></div>`:""}
</div>`;
const cell=(t,el)=>`<div class="cell"><code>${t}</code>${el}</div>`;
const types=["info","success","attention","warning","icon"];
const content=()=>`<div class="grid">${types.map(t=>
  ["message","links","buttons"].map(s=>cell(`${t} — ${s}`,toast(t,s))).join("")).join("")}</div>`;
l.innerHTML=content(); d.innerHTML=content();
</script>
</body>
</html>
