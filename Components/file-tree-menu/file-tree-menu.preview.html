<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; gap: var(--space-24); align-items:flex-start; }
  .mode { flex:1; padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  .menus { display:flex; gap: var(--space-24); align-items:flex-start; }
  .grep-tree-menu { width: 300px; }
  .grep-tree-menu__list { max-height: 280px; }
  .grep-tree-item__folder { width:13.991px; height:11.824px; }
</style>
</head>
<body>

    <div class="mode"><h2>Light</h2><div id="l"></div></div>

const CHECK=`<svg class="grep-checkbox__mark" aria-hidden="true" width="7.72507" height="7.72507" viewBox="0 0 7.72507 7.72507" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.4477 0.0999263C7.73082 0.285047 7.81027 0.664635 7.62515 0.94776L3.37515 7.44776C3.27111 7.60688 3.09909 7.70866 2.90954 7.72326C2.71999 7.73786 2.53441 7.66362 2.40724 7.52231L0.157238 5.02231C-0.0690561 4.77087 -0.048673 4.3836 0.202764 4.1573C0.454202 3.93101 0.841479 3.95139 1.06777 4.20283L2.78538 6.11129L6.59986 0.27738C6.78498 -0.00574548 7.16457 -0.0851942 7.4477 0.0999263Z" fill="white"/></svg>`;

const cb = on => `<span class="grep-checkbox ${on?"grep-checkbox--checked":""}">
  <span class="grep-checkbox__box">${CHECK}</span></span>`;

function item({depth=0, caret="open", label, type, checked=false, state=""}) {
  let g = "";
  for (let i=0;i<depth;i++) g += `<span class="grep-tree-item__guide"></span>`;
  const c = caret==="none"
    ? `<button class="grep-tree-item__caret grep-tree-item__caret--empty">${CARET}</button>`
    : `<button class="grep-tree-item__caret">${CARET}</button>`;
  const ctl = type==="text" ? "" : `<span class="grep-tree-item__control">${cb(checked)}</span>`;
  const mods = [caret==="closed"?"grep-tree-item--collapsed":"", state==="selected"?"grep-tree-item--selected":""].join(" ");
  const hov = state==="hover" ? ` data-state="hover"` : "";
  return `<li class="grep-tree-item ${mods}"${hov}>${g}${c}
    <div class="grep-tree-item__frame">${ctl}
      <span class="grep-tree-item__visual">${FOLDER}</span>
      <span class="grep-tree-item__label">${label}</span></div></li>`;
}

function menu(type, heading) {
  const rows = [
    {depth:0, label:"01_Drafts", type, checked:true},
    {depth:1, label:"Concepts", type},
    {depth:2, caret:"none", label:"moodboard_v3.png", type, state:"hover"},
    {depth:2, caret:"none", label:"storyboard_final.pdf", type, checked:true, state:"selected"},
    {depth:1, caret:"closed", label:"Archive", type},
    {depth:0, caret:"closed", label:"02_Shoots", type},
    {depth:0, caret:"none", label:"brief.md", type},
  ].map(item).join("");
  return `<div class="grep-tree-menu">
    <div style="display:flex;align-items:center;">
      ${SEARCH.replace('class="grep-tree-menu__search-icon"','class="grep-tree-menu__search-icon" style="margin:6px 0 6px 14px"')}
      <input class="grep-tree-menu__search" style="flex:1;margin-left:0" placeholder="Search files and folders...">
    </div>
    <hr class="grep-tree-menu__rule">
    <ul class="grep-tree-menu__list">
      ${heading?`<li class="grep-tree-menu__heading">Heading<button class="grep-tree-menu__heading-action">Select all</button></li>`:""}
      ${rows}
    </ul></div>`;
}
const content = () => `<div class="menus">${menu("checkbox",true)}${menu("text",false)}</div>`;
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
