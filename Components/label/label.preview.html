<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-32); }
  .cell { display:flex; flex-direction:column; gap: var(--space-8); }
  code { font-family: var(--text-style-code), monospace; font-size: var(--text-2xs);
         color: var(--foreground-text-faint); }
</style>
</head>
<body>


  <div class="modes">
    <div class="mode"><h2>Light</h2><div id="l"></div></div>
    <div class="mode" data-theme="dark"><h2>Dark</h2><div id="d"></div></div>
  </div>

const BDG=`<svg class="" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M1.09375 7C1.09375 7.1958 1.17153 7.38359 1.30999 7.52204C1.44844 7.6605 1.63623 7.73828 1.83203 7.73828H6.13867C6.17131 7.73828 6.2026 7.75124 6.22568 7.77432C6.24875 7.7974 6.26172 7.82869 6.26172 7.86133V12.168C6.26172 12.3638 6.3395 12.5516 6.47796 12.69C6.61641 12.8285 6.8042 12.9062 7 12.9062C7.1958 12.9062 7.38359 12.8285 7.52204 12.69C7.6605 12.5516 7.73828 12.3638 7.73828 12.168V7.86133C7.73828 7.82869 7.75124 7.7974 7.77432 7.77432C7.7974 7.75124 7.82869 7.73828 7.86133 7.73828H12.168C12.3638 7.73828 12.5516 7.6605 12.69 7.52204C12.8285 7.38359 12.9062 7.1958 12.9062 7C12.9062 6.8042 12.8285 6.61641 12.69 6.47796C12.5516 6.3395 12.3638 6.26172 12.168 6.26172H7.86133C7.82869 6.26172 7.7974 6.24875 7.77432 6.22568C7.75124 6.2026 7.73828 6.17131 7.73828 6.13867V1.83203C7.73828 1.63623 7.6605 1.44844 7.52204 1.30999C7.38359 1.17153 7.1958 1.09375 7 1.09375C6.8042 1.09375 6.61641 1.17153 6.47796 1.30999C6.3395 1.44844 6.26172 1.63623 6.26172 1.83203V6.13867C6.26172 6.17131 6.24875 6.2026 6.22568 6.22568C6.2026 6.24875 6.17131 6.26172 6.13867 6.26172H1.83203C1.63623 6.26172 1.44844 6.3395 1.30999 6.47796C1.17153 6.61641 1.09375 6.8042 1.09375 7Z" fill="currentColor"/></g></svg>`;

const lbl = ({mods="", icon=false, optional=false, info=false, badge=false, sub="This is some sublabel."}) =>
  `<div class="grep-label ${mods}">
     <div class="grep-label__row">
       ${icon?ICON:""}
       <div class="grep-label__group">
         <span class="grep-label__text">Label</span>
         ${optional?`<span class="grep-label__optional">(Optional)</span>`:""}
         ${info?INFO:""}
       </div>
       ${badge?`<span class="grep-label__badge">${BDG}Label</span>`:""}
     </div>
     ${sub?`<p class="grep-label__sublabel">${sub}</p>`:""}
   </div>`;

const cell = (t, el) => `<div class="cell"><code>${t}</code>${el}</div>`;
const content = () => `<div class="grid">
  ${cell("base", lbl({}))}
  ${cell("--bold --sub-subtle", lbl({mods:"grep-label--bold grep-label--sub-subtle"}))}
  ${cell("--lg", lbl({mods:"grep-label--lg"}))}
  ${cell("--lg --bold --sub-subtle", lbl({mods:"grep-label--lg grep-label--bold grep-label--sub-subtle"}))}
  ${cell("--sub-sm --bold", lbl({mods:"grep-label--sub-sm grep-label--bold"}))}
  ${cell("--path", lbl({mods:"grep-label--path", sub:"/Media/Assets/.../ACAM.mov"}))}
  ${cell("--path --sub-xs", lbl({mods:"grep-label--path grep-label--sub-xs", sub:"/Media/Assets/.../ACAM.mov"}))}
  ${cell("all adornments", lbl({icon:true, optional:true, info:true, badge:true}))}
  ${cell("no sublabel", lbl({sub:""}))}
</div>`;
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
</body>
</html>
