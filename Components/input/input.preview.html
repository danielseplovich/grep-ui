<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
  h3 { font-size: var(--text-xs); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin: var(--space-32) 0 var(--space-16); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-24); }
</style>
</head>
<body>


  <div class="modes">
    <div class="mode"><h2>Light</h2><div id="l"></div></div>
    <div class="mode" data-theme="dark"><h2>Dark</h2><div id="d"></div></div>
  </div>
<script>
const PLUS=`<svg class="grep-input__label-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M1.09375 7C1.09375 7.1958 1.17153 7.38359 1.30999 7.52204C1.44844 7.6605 1.63623 7.73828 1.83203 7.73828H6.13867C6.17131 7.73828 6.2026 7.75124 6.22568 7.77432C6.24875 7.7974 6.26172 7.82869 6.26172 7.86133V12.168C6.26172 12.3638 6.3395 12.5516 6.47796 12.69C6.61641 12.8285 6.8042 12.9062 7 12.9062C7.1958 12.9062 7.38359 12.8285 7.52204 12.69C7.6605 12.5516 7.73828 12.3638 7.73828 12.168V7.86133C7.73828 7.82869 7.75124 7.7974 7.77432 7.77432C7.7974 7.75124 7.82869 7.73828 7.86133 7.73828H12.168C12.3638 7.73828 12.5516 7.6605 12.69 7.52204C12.8285 7.38359 12.9062 7.1958 12.9062 7C12.9062 6.8042 12.8285 6.61641 12.69 6.47796C12.5516 6.3395 12.3638 6.26172 12.168 6.26172H7.86133C7.82869 6.26172 7.7974 6.24875 7.77432 6.22568C7.75124 6.2026 7.73828 6.17131 7.73828 6.13867V1.83203C7.73828 1.63623 7.6605 1.44844 7.52204 1.30999C7.38359 1.17153 7.1958 1.09375 7 1.09375C6.8042 1.09375 6.61641 1.17153 6.47796 1.30999C6.3395 1.44844 6.26172 1.63623 6.26172 1.83203V6.13867C6.26172 6.17131 6.24875 6.2026 6.22568 6.22568C6.2026 6.24875 6.17131 6.26172 6.13867 6.26172H1.83203C1.63623 6.26172 1.44844 6.3395 1.30999 6.47796C1.17153 6.61641 1.09375 6.8042 1.09375 7Z" fill="currentColor"/></g></svg>`;
const CARET=`<svg class="" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M9.59012 4.5C9.75318 4.50006 9.91324 4.53731 10.0535 4.60784C10.1939 4.67838 10.3093 4.77961 10.3877 4.90096C10.4662 5.02231 10.5048 5.15933 10.4995 5.29768C10.4943 5.43603 10.4453 5.57064 10.3578 5.68745L7.7683 9.14212C7.68608 9.25179 7.5726 9.34209 7.43835 9.40465C7.30411 9.4672 7.15344 9.5 7.0003 9.5C6.84716 9.5 6.6965 9.4672 6.56225 9.40465C6.42801 9.34209 6.31453 9.25179 6.23231 9.14212L3.64219 5.68745C3.55465 5.57061 3.50571 5.43595 3.50047 5.29755C3.49523 5.15915 3.5339 5.0221 3.61243 4.90074C3.69095 4.77937 3.80645 4.67815 3.94685 4.60765C4.08724 4.53715 4.24737 4.49997 4.41049 4.5H9.59012Z" fill="currentColor" fill-opacity="0.44"/></g></svg>`;
const CHECK=`<svg class="grep-checkbox__mark grep-checkbox__mark--check" aria-hidden="true" width="7.72507" height="7.72507" viewBox="0 0 7.72507 7.72507" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.4477 0.0999263C7.73082 0.285047 7.81027 0.664635 7.62515 0.94776L3.37515 7.44776C3.27111 7.60688 3.09909 7.70866 2.90954 7.72326C2.71999 7.73786 2.53441 7.66362 2.40724 7.52231L0.157238 5.02231C-0.0690561 4.77087 -0.048673 4.3836 0.202764 4.1573C0.454202 3.93101 0.841479 3.95139 1.06777 4.20283L2.78538 6.11129L6.59986 0.27738C6.78498 -0.00574548 7.16457 -0.0851942 7.4477 0.0999263Z" fill="currentColor"/></svg>`;

const label = (t,sub=true) => `<div class="grep-input__label">
  <span class="grep-input__label-row">${PLUS}${t}</span>
  ${sub?`<p class="grep-input__sublabel">This is some sublabel.</p>`:""}</div>`;
const help = t => `<p class="grep-input__help">${t||"This is some help text."}</p>`;
const btn  = ic => `<button class="grep-input__button">${ic}</button>`;
const rule = `<span class="grep-input__rule"></span>`;

function field(inner, mods="") {
  return `<div class="grep-input ${mods}">${label(inner.title)}
    <div class="grep-input__field-container">
      <div class="grep-input__field">${inner.body}</div>
      ${help(inner.help)}</div></div>`;
}

const ctl = ph => `<input class="grep-input__control" placeholder="${ph}">`;

const TYPES = [
  {title:"Text",     body: ctl("Enter...") + `<span class="grep-input__addon">${rule}${btn(PLUS)}</span>`},
  {title:"Password", body: ctl("••••••••") + `<span class="grep-input__addon">${rule}${btn(PLUS)}</span>`},
  {title:"Number",   body: ctl("0") + `<span class="grep-input__addon">${rule}${btn(CARET)}${rule}${btn(CARET)}</span>`},
  {title:"Currency", body: `<span class="grep-input__addon">${btn(PLUS)}${rule}</span>` + ctl("0.00") +
                            `<span class="grep-input__addon">${rule}<span class="grep-input__unit">USD</span></span>`},
  {title:"Date",     body: ctl("MM / DD / YYYY")},
  {title:"Time",     body: ctl("HH : MM") + `<span class="grep-input__addon">${rule}<span class="grep-input__unit">EST</span></span>`},
  {title:"Checkbox", body: `<span class="grep-input__inset"><span class="grep-checkbox grep-checkbox--checked"><span class="grep-checkbox__box">${CHECK}</span></span></span>`},
  {title:"Rating",   body: `<span class="grep-input__inset" style="gap:2px;color:var(--background-accent-favorite)">${"★".repeat(3)}<span style="color:var(--foreground-icon-faint)">${"★".repeat(2)}</span></span>`},
];

function content(){
  let h = `<h3>Types — 28</h3><div class="grid">` + TYPES.map(t=>field(t)).join("") + `</div>`;
  h += `<h3>Size 32</h3><div class="grid">`;
  h += field({title:"Text", body: ctl("Enter...") + `<span class="grep-input__addon">${rule}${btn(PLUS)}</span>`}, "grep-input--32");
  h += field({title:"Currency", body: `<span class="grep-input__addon">${btn(PLUS)}${rule}</span>` + ctl("0.00") +
                `<span class="grep-input__addon">${rule}<span class="grep-input__unit">USD</span></span>`}, "grep-input--32");
  h += `</div><h3>States</h3><div class="grid">`;
  h += field({title:"Empty", body: ctl("Enter...")});
  h += field({title:"Hover (read)", body: ctl("Enter...")}, '" data-state="hover');
  h += field({title:"Focused", body: ctl("Enter...")}, '" data-state="focused');
  h += field({title:"Filled", body: `<input class="grep-input__control" value="Some value">`});
  h += field({title:"Error", body: ctl("Enter..."), help:"Something needs fixing."}, "grep-input--error");
  h += field({title:"Disabled", body: ctl("Enter...")}, "grep-input--disabled");
  return h + `</div>`;
}
document.getElementById("l").innerHTML = content();
document.getElementById("d").innerHTML = content();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
</body>
</html>
