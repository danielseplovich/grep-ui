<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  .rows { display:flex; flex-direction:column; gap: var(--space-16); }
  .row { display:flex; align-items:center; gap: var(--space-20); }
  .rowlab { width: var(--space-80); flex-shrink:0; font-size: var(--text-xs); color: var(--foreground-text-dim); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
</style>
</head>
<body>


  <div class="modes">
    <div class="mode"><h2>Light</h2><div class="rows" id="l"></div></div>
    <div class="mode" data-theme="dark"><h2>Dark</h2><div class="rows" id="d"></div></div>

const crumb = (label, mods="", visual=FOLDER) => {
  const tag = mods.includes("active") ? "span" : "button";
  const vis = visual ? `<span class="grep-crumb__visual">${visual}</span>` : "";
  const lab = label ? `<span class="grep-crumb__label">${label}</span>` : "";
  return `<${tag} class="grep-crumb ${mods}">${vis}${lab}</${tag}>`;
};
const trail = (inner, mods="") =>
  `<nav class="grep-breadcrumbs ${mods}" aria-label="Breadcrumb">${inner}</nav>`;

function rows() {
  const S = SEP;
  return `
  <div class="row"><span class="rowlab">String</span>${trail(
    crumb("Breadcrumb","grep-crumb--folder") + S +
    crumb("","grep-crumb--icon-only",DOTS) + S +
    crumb("Breadcrumb","grep-crumb--folder") + S +
    crumb("Breadcrumb","grep-crumb--folder") + S +
    crumb("Breadcrumb","grep-crumb--folder grep-crumb--active"))}</div>

  <div class="row"><span class="rowlab">Two Items</span>${trail(
    crumb("Breadcrumb","grep-crumb--folder") + S +
    crumb("Breadcrumb","grep-crumb--folder grep-crumb--active"), "grep-breadcrumbs--two-items")}</div>

  <div class="row"><span class="rowlab">Hover</span>${trail(
    crumb("Breadcrumb",'grep-crumb--folder" data-state="hover') + S +
    crumb("","grep-crumb--icon-only",DOTS) + S +
    crumb("Breadcrumb","grep-crumb--folder grep-crumb--active"))}</div>

  <div class="row"><span class="rowlab">Icon only</span>${trail(
    crumb("","grep-crumb--icon-only",DOTS) + S +
    crumb("","grep-crumb--icon-only",DOTS))}</div>

  <div class="row"><span class="rowlab">Simplified</span>${trail(
    crumb("Breadcrumb","grep-crumb--simplified","") + S +
    crumb("Breadcrumb","grep-crumb--simplified","") + S +
    crumb("Breadcrumb",'grep-crumb--simplified" data-state="hover',"") + S +
    crumb("Breadcrumb","grep-crumb--simplified",""), "grep-breadcrumbs--simplified")}</div>`;
}
document.getElementById("l").innerHTML = rows();
document.getElementById("d").innerHTML = rows();
</script>


<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
