<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Grep UI — Button state matrix</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">
<style>
  html { font-family: var(--text-style-body), system-ui, sans-serif; font-size: var(--text-base);
         color: var(--foreground-text-base); background: var(--background-canvas);
         -webkit-font-smoothing: antialiased; }
  body { margin: 0; padding: var(--space-32); }
  .modes { display: flex; gap: var(--space-32); align-items: flex-start; }
  .mode { flex: 1; padding: var(--space-24); border-radius: var(--radius-12);
          border: 0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin: 0 0 var(--space-20); text-transform: uppercase;
       letter-spacing: 0.04em; }
  table { border-collapse: collapse; }
  th { font-size: var(--text-xs); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); text-align: left; padding: 0 var(--space-16) var(--space-10) 0; }
  td { padding: 0 var(--space-16) var(--space-16) 0; }
  td.rowhead { font-size: var(--text-xs); color: var(--foreground-text-dim);
               padding-right: var(--space-20); }
</style>
</head>
<body>
<div class="modes">
  <div class="mode" id="light"></div>
  <div class="mode" id="dark" data-theme="dark"></div>
</div>

<script>
const types  = [["brand","Brand"],["neutral","Neutral"],["inverted","Inverted"],["danger","Danger"]];
const states = [["","Default"],["hover","Hover"],["focused","Focused"],["loading","Loading"],["disabled","Disabled"]];

const spinner = `<svg class="grep-btn__spinner" aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_0_9)"><g><path d="M6.99979 0.437212C7.32927 0.437212 7.59638 0.704315 7.59638 1.0338V2.22698C7.59638 2.55647 7.32927 2.82358 6.99979 2.82358C6.6703 2.82358 6.4032 2.55647 6.4032 2.22698V1.0338C6.4032 0.704315 6.6703 0.437212 6.99979 0.437212Z" fill="currentColor"/><path d="M3.71853 1.31658C4.00387 1.15183 4.36874 1.24959 4.53349 1.53493L5.13008 2.56823C5.29483 2.85357 5.19707 3.21844 4.91172 3.38319C4.62638 3.54794 4.26151 3.45017 4.09676 3.16483L3.50017 2.13154C3.33543 1.84619 3.43319 1.48132 3.71853 1.31658Z" fill="currentColor"/><path d="M10.281 1.31658C10.5664 1.48132 10.6641 1.84619 10.4994 2.13154L9.90281 3.16483C9.73806 3.45017 9.37319 3.54794 9.08785 3.38319C8.80251 3.21844 8.70474 2.85357 8.86949 2.56823L9.46608 1.53493C9.63083 1.24959 9.9957 1.15183 10.281 1.31658Z" fill="currentColor"/><path d="M1.31665 3.71846C1.4814 3.43311 1.84627 3.33535 2.13161 3.5001L3.16491 4.09669C3.45025 4.26144 3.54801 4.62631 3.38326 4.91165C3.21852 5.19699 2.85365 5.29476 2.5683 5.13001L1.53501 4.53342C1.24966 4.36867 1.1519 4.0038 1.31665 3.71846Z" fill="currentColor"/><path d="M12.6829 3.71846C12.8477 4.0038 12.7499 4.36867 12.4646 4.53342L11.4313 5.13001C11.1459 5.29476 10.7811 5.19699 10.6163 4.91165C10.4516 4.62631 10.5493 4.26144 10.8347 4.09669L11.868 3.5001C12.1533 3.33535 12.5182 3.43311 12.6829 3.71846Z" fill="currentColor"/><path d="M0.437286 6.99971C0.437286 6.67022 0.704389 6.40312 1.03388 6.40312H2.22706C2.55655 6.40312 2.82365 6.67022 2.82365 6.99971C2.82365 7.3292 2.55655 7.5963 2.22706 7.5963H1.03388C0.704389 7.5963 0.437286 7.3292 0.437286 6.99971Z" fill="currentColor"/><path d="M11.1759 6.99971C11.1759 6.67022 11.443 6.40312 11.7725 6.40312H12.9657C13.2952 6.40312 13.5623 6.67022 13.5623 6.99971C13.5623 7.3292 13.2952 7.5963 12.9657 7.5963H11.7725C11.443 7.5963 11.1759 7.3292 11.1759 6.99971Z" fill="currentColor"/><path d="M3.38326 9.08777C3.54801 9.37312 3.45025 9.73799 3.16491 9.90273L2.13161 10.4993C1.84627 10.6641 1.4814 10.5663 1.31665 10.281C1.1519 9.99563 1.24966 9.63076 1.53501 9.46601L2.5683 8.86942C2.85365 8.70467 3.21852 8.80243 3.38326 9.08777Z" fill="currentColor"/><path d="M10.6163 9.08777C10.7811 8.80243 11.1459 8.70467 11.4313 8.86942L12.4646 9.46601C12.7499 9.63076 12.8477 9.99563 12.6829 10.281C12.5182 10.5663 12.1533 10.6641 11.868 10.4993L10.8347 9.90273C10.5493 9.73799 10.4516 9.37312 10.6163 9.08777Z" fill="currentColor"/><path d="M4.91172 10.6162C5.19707 10.781 5.29483 11.1459 5.13008 11.4312L4.53349 12.4645C4.36874 12.7498 4.00387 12.8476 3.71853 12.6828C3.43319 12.5181 3.33543 12.1532 3.50017 11.8679L4.09676 10.8346C4.26151 10.5492 4.62638 10.4515 4.91172 10.6162Z" fill="currentColor"/><path d="M9.08785 10.6162C9.37319 10.4515 9.73806 10.5492 9.90281 10.8346L10.4994 11.8679C10.6641 12.1532 10.5664 12.5181 10.281 12.6828C9.9957 12.8476 9.63083 12.7498 9.46608 12.4645L8.86949 11.4312C8.70474 11.1459 8.80251 10.781 9.08785 10.6162Z" fill="currentColor"/><path d="M6.99979 11.1758C7.32927 11.1758 7.59638 11.443 7.59638 11.7724V12.9656C7.59638 13.2951 7.32927 13.5622 6.99979 13.5622C6.6703 13.5622 6.4032 13.2951 6.4032 12.9656V11.7724C6.4032 11.443 6.6703 11.1758 6.99979 11.1758Z" fill="currentColor"/></g></g><defs><clipPath><rect width="14" height="14" fill="currentColor"/></clipPath></defs></svg>`;

const icon = `<svg class="grep-btn__icon" viewBox="0 0 14 14" fill="none" aria-hidden="true">
  <path d="M7 3v8M3 7h8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>`;

function btn(type, state) {
  // hover is forced with a class since :hover can't be screenshotted
  const forced = state === "hover" ? ` style="${type==='brand'?'background:var(--button-brand-background-hover)':
      type==='danger'?'background:var(--button-danger-background-hover)':''}"` : "";
  const attr = (state && state !== "hover") ? ` data-state="${state}"` : "";
  const overlay = state === "hover" && (type === "neutral" || type === "inverted");
  return `<button class="grep-btn grep-btn--${type}${overlay ? ' is-hover' : ''}"${attr}${forced}>
    ${icon}<span class="grep-btn__label">Label</span>${icon}
    ${spinner}</button>`;
}

function table(){
  let h = `<table><tr><th></th>${states.map(s=>`<th>${s[1]}</th>`).join("")}</tr>`;
  for (const [t,tl] of types) {
    h += `<tr><td class="rowhead">${tl}</td>` +
         states.map(s=>`<td>${btn(t,s[0])}</td>`).join("") + `</tr>`;
  }
  return h + `</table>`;
}

document.getElementById("light").innerHTML = `<h2>Light</h2>` + table();
document.getElementById("dark").innerHTML  = `<h2>Dark</h2>`  + table();
</script>

<style>
  /* forced hover overlay for the static matrix */
  .grep-btn.is-hover.grep-btn--neutral::before { background: var(--button-neutral-background-overlay-hover); }
  .grep-btn.is-hover.grep-btn--inverted::before { background: var(--button-contrast-background-overlay-hover); }
  /* dark panel needs its own canvas so the focus ring gap reads correctly */
  #dark { background: var(--background-canvas); color: var(--foreground-text-base); }
</style>
</body>
</html>
