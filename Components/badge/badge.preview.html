  html {
    font-family: var(--text-style-body), system-ui, sans-serif;

    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;

  .modes { display:flex; gap: var(--space-24); align-items:flex-start; }

          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  .rows { display:flex; flex-direction:column; gap: var(--space-12); }
  .row { display:flex; align-items:center; gap: var(--space-10); }
  .rowlab { width: var(--space-80); flex-shrink:0; font-size: var(--text-xs); color: var(--foreground-text-dim); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium);
       color: var(--foreground-text-dim); margin:0 0 var(--space-20);
       text-transform:uppercase; letter-spacing:0.04em; }
</style>
</head>

const TONES = [["neutral-base","Neutral Base"],["neutral-dim","Neutral Dim"],["brand","Brand"],

  ["fuschia","Fuschia"],["orange","Orange"],["blue","Blue"],["cyan","Cyan"],["teal","Teal"]];

function badge(tone, radius, parts) {
  const icon  = parts.includes("i") ? ICON : "";
  const close = parts.includes("x") ? CLOSE : "";
  return `<span class="grep-badge grep-badge--${tone} grep-badge--${radius}">${icon}<span class="grep-badge__label">Label</span>${close}</span>`;
}
function rows() {
  let h = "";
  for (const [t, label] of TONES) {
    h += `<div class="row"><span class="rowlab">${label}</span>
      ${badge(t,"full","i")}${badge(t,"rounded","i")}${badge(t,"full","ix")}${badge(t,"full","")}
      <span class="grep-badge grep-badge--${t} grep-badge--full"><span class="grep-badge__label">7</span></span>

  }
  return h;
}
