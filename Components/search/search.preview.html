<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grep prototype</title>

<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../grepmd/grep-ui.css">

<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-24); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium); color: var(--foreground-text-dim);
       margin:0 0 var(--space-20); text-transform:uppercase; letter-spacing:0.04em; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-24); }
  .cell { display:flex; flex-direction:column; gap: var(--space-8); }
  code { font-family: var(--text-style-code), monospace; font-size: var(--text-2xs); color: var(--foreground-text-faint); }
</style>
</head>
<body>


  <div class="modes"><div class="mode"><h2>Light</h2><div id="l"></div></div>
  <div class="mode" data-theme="dark"><h2>Dark</h2><div id="d"></div></div></div>

const SC=`<span class="grep-search__shortcut">
  <span class="grep-kbd grep-kbd--icon">${KBD}</span>
  <span class="grep-kbd grep-kbd--letter"><span>F</span></span></span>`;
const s=({mods="",state="",val="",ph="Search...",sc=true})=>
 `<div class="grep-search ${mods}"${state?` data-state="${state}"`:""}>
    <span class="grep-search__label">${SRCH}
      <input class="grep-search__input" placeholder="${ph}"${val?` value="${val}"`:""}></span>
    ${sc?SC:""}</div>`;
const cell=(t,el)=>`<div class="cell"><code>${t}</code>${el}</div>`;
const content=()=>`<div class="grid">
  ${cell("Field 28 — empty", s({}))}
  ${cell("Field 28 — hover", s({state:"hover"}))}
  ${cell("Field 28 — focused", s({state:"focused"}))}
  ${cell("Field 28 — filled", s({val:"This is the search"}))}
  ${cell("Field 28 — danger", s({mods:"grep-search--danger", val:"This is the search"}))}
  ${cell("Ghost 28", s({mods:"grep-search--ghost", sc:false}))}
  ${cell("Field 32", s({mods:"grep-search--32"}))}
  ${cell("Field 32 — focused", s({mods:"grep-search--32", state:"focused"}))}
  ${cell("Ghost 32", s({mods:"grep-search--ghost grep-search--32", sc:false}))}
</div>`;
document.getElementById("l").innerHTML=content();
document.getElementById("d").innerHTML=content();
</script>

<script>
  // Follow the OS theme. Remove if the prototype needs a fixed mode.
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => (document.documentElement.dataset.theme = dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = "light";
</script>
</body>
</html>
