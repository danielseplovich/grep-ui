<style>
  html {
    font-family: var(--text-style-body), system-ui, sans-serif;
    font-size: var(--text-base);
    font-weight: var(--text-weight-regular);
    color: var(--foreground-text-base);
    background: var(--background-canvas);
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; }
  h1, h2, h3 {
    font-family: var(--text-style-display), var(--text-style-body), sans-serif;
    font-weight: var(--text-weight-bold);
  }
  code, kbd, pre { font-family: var(--text-style-code), ui-monospace, monospace; }
  body { padding: var(--space-32); }
  .modes { display:flex; flex-direction:column; gap: var(--space-24); }
  .mode { padding: var(--space-32); border-radius: var(--radius-12);
          border:0.5px solid var(--border-base); background: var(--background-canvas); }
  h2 { font-size: var(--text-sm); font-weight: var(--text-weight-medium); color: var(--foreground-text-dim);
       margin:0 0 var(--space-20); text-transform:uppercase; letter-spacing:0.04em; }
  .grid { display:grid; grid-template-columns: repeat(3, max-content); gap: var(--space-32) var(--space-40); }
  .cell { display:flex; flex-direction:column; gap: var(--space-12); align-items:flex-start; }
  code { font-family: var(--text-style-code), monospace; font-size: var(--text-2xs); color: var(--foreground-text-faint); }
</style>
</head>

const TAIL=`<span class="grep-tooltip__tail">${A.tail}</span>`;
const sentence=`<p class="grep-tooltip__text">This is some tooltip that spans two or more lines<br>and contains information that helps the user.</p>`;
const shortcut=`<span class="grep-tooltip__shortcut">
  <span class="grep-tooltip__shortcut-label">Label</span>
  <span class="grep-tooltip__keys"><span class="grep-kbd grep-kbd--icon">${A.cmd}</span></span></span>`;
const crumb=t=>`<span class="grep-crumb grep-crumb--simplified">${t}</span>`;
const crumbs=`<span class="grep-breadcrumbs grep-breadcrumbs--simplified">
  ${crumb("Breadcrumb")}${A.chev}${crumb("Breadcrumb")}${A.chev}${crumb("Breadcrumb")}${A.chev}${crumb("Breadcrumb")}</span>`;
const body={sentence,shortcut,crumbs};
const tip=(type,place)=>`<div class="grep-tooltip${place?" grep-tooltip--"+place.split(" ").join(" grep-tooltip--"):""}" role="tooltip">
  ${body[type]}${place?TAIL:""}</div>`;
const cell=(t,el)=>`<div class="cell"><code>${t}</code>${el}</div>`;
const places=[["top left","top left"],["bottom left","bottom left"],["top right","top right"],
              ["bottom right","bottom right"],["top middle","top middle"],["bottom middle","bottom middle"],["no arrow",""]];
const content=()=>`<div class="grid">${places.map(([n,p])=>
  ["sentence","shortcut","crumbs"].map(t=>cell(`${t} — ${n}`,tip(t,p))).join("")).join("")}</div>`;
l.innerHTML=content(); d.innerHTML=content();
